apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ndb-sm
  labels:
    version: "{{ .Chart.Version | replace "+" "_" }}"
    chart: "{{ .Chart.Name }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  namespaceSelector:
    matchNames:
    - "{{ .Release.Namespace }}"
  selector:
    matchLabels:
      metrics: "enabled"
  endpoints:
  - port: metrics
    # With Istio mTLS the scrape is https; HTTP/2 would reach the HTTP/1.1-only
    # metrics server undecoded on ports Istio handles as TCP.
    enableHttp2: false
    interval: {{ ((.Values.serviceMonitor).interval) | default "60s" }}
    path: /metrics